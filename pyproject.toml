[project]
name = "flashcards"
version = "0.1.0"
description = "A flashcard learning web application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "blinker==1.9.0",
    "click==8.4.2",
    "flask==3.1.3",
    "itsdangerous==2.2.0",
    "jinja2==3.1.6",
    "markupsafe==3.0.3",
    "werkzeug==3.1.8",
    "python-dotenv==1.2.2",
]

[project.optional-dependencies]
dev = [
    "ruff==0.15.22",
]

[tool.ruff]
output-format = "full"
target-version = "py312"

lint.select = [
    "E",
    "W",
    "F",
    "I",
    "C",
    "B",
    "Q",
    "N",
]

extend-exclude = [
    "__pycache__",
    ".git",
    ".venv",
    "venv",
    "build",
    "dist",
    "versions",
]

line-length = 120

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = []
known-third-party = ["blinker", "click", "flask", "itsdangerous", "jinja2", "markupsafe", "werkzeug"]

[dependency-groups]
dev = [
    "ruff>=0.15.22",
]
